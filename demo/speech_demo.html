<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Speech-to-speech demo of the Apollo Voice Engine using Whisper speech recognition, safety classification and Edge-TTS for Indian languages.">
    <meta name="theme-color" content="#0f0f23">
    <title>Apollo Voice Engine - Speech Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #00d4ff;
            --secondary: #00ff94;
            --danger: #ff4757;
            --warning: #ffc800;
            --bg-dark: #0a0a1a;
            --bg-card: rgba(255,255,255,0.05);
            --text: #ffffff;
            --text-muted: #8888aa;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(0,212,255,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0,255,148,0.1) 0%, transparent 50%);
            min-height: 100vh;
            color: var(--text);
        }
        
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 30px 0; }
        
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .subtitle { color: var(--text-muted); margin-bottom: 15px; }
        
        .tech-badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .tech-badge {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
        }
        
        .tech-badge.highlight {
            background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(0,255,148,0.2));
            border-color: var(--secondary);
        }
        
        .main-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .lang-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .lang-btn {
            padding: 10px 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: transparent;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .lang-btn:hover { border-color: var(--primary); }
        .lang-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            color: var(--bg-dark);
        }
        
        .mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 25px 0;
        }
        
        .mic-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--bg-dark);
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(0,212,255,0.3);
        }
        
        .mic-btn:hover { transform: scale(1.05); }
        
        .mic-btn.recording {
            animation: pulse 1s infinite;
            background: linear-gradient(135deg, var(--danger), #ff6b7a);
        }
        
        .mic-btn.processing {
            background: linear-gradient(135deg, var(--warning), #ffda44);
            animation: spin 1s linear infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .status-text {
            margin-top: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }
        
        .status-text.recording { color: var(--danger); font-weight: 600; }
        .status-text.processing { color: var(--warning); }
        .status-text.speaking { color: var(--secondary); }
        
        .chat-container {
            max-height: 350px;
            overflow-y: auto;
            margin-top: 20px;
        }
        
        .chat-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            max-width: 85%;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .chat-bubble.user {
            background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(0,255,148,0.1));
            border: 1px solid rgba(0,212,255,0.3);
            margin-left: auto;
        }
        
        .chat-bubble.assistant {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .chat-bubble.emergency {
            background: rgba(255,71,87,0.2);
            border-color: var(--danger);
        }
        
        .chat-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        
        .safety-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .safety-badge.safe { background: var(--secondary); color: var(--bg-dark); }
        .safety-badge.caution { background: var(--warning); color: var(--bg-dark); }
        .safety-badge.emergency { background: var(--danger); color: white; }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        
        .metric-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        
        .metric-value {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .metric-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        
        .examples {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .example-btn {
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .example-btn:hover { background: rgba(255,255,255,0.1); }
        .example-btn.emergency { border-color: var(--danger); color: var(--danger); }
        
        button:focus-visible { outline: 2px solid #4facfe; outline-offset: 2px; }

        @media (max-width: 600px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 16px; }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 Apollo Voice Engine</h1>
            <p class="subtitle">Real-Time Speech-to-Speech with Whisper + Edge-TTS</p>
            <div class="tech-badges">
                <span class="tech-badge highlight">🎤 OpenAI Whisper STT</span>
                <span class="tech-badge highlight">🔊 Microsoft Edge TTS</span>
                <span class="tech-badge">🔐 Safety First</span>
            </div>
        </header>
        
        <div class="main-card">
            <div class="lang-buttons" role="group" aria-label="Response language">
                <button type="button" class="lang-btn" data-lang="hi" aria-pressed="false">हिंदी</button>
                <button type="button" class="lang-btn" data-lang="ta" aria-pressed="false">தமிழ்</button>
                <button type="button" class="lang-btn" data-lang="te" aria-pressed="false">తెలుగు</button>
                <button type="button" class="lang-btn" data-lang="kn" aria-pressed="false">ಕನ್ನಡ</button>
                <button type="button" class="lang-btn active" data-lang="en" aria-pressed="true">English</button>
            </div>
            
            <div class="mic-container">
                <button type="button" id="micBtn" class="mic-btn" aria-label="Hold to record your question">🎤</button>
                <p id="statusText" class="status-text" role="status" aria-live="polite">Click and hold to speak</p>
            </div>
            
            <div id="chatContainer" class="chat-container" aria-live="polite" aria-label="Conversation"></div>
            
            <div class="examples">
                <span style="color: var(--text-muted); font-size: 12px;">Try:</span>
                <button type="button" class="example-btn" onclick="sendText('What time does the pharmacy open?')">Pharmacy</button>
                <button type="button" class="example-btn" onclick="sendText('I need to book an appointment')">Appointment</button>
                <button type="button" class="example-btn" onclick="sendText('Where is cardiology?')">Cardiology</button>
                <button type="button" class="example-btn emergency" onclick="sendText('I have chest pain')">⚠️ Emergency</button>
            </div>
        </div>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-value" id="sttMetric">--</div>
                <div class="metric-label">STT (ms)</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="ttsMetric">--</div>
                <div class="metric-label">TTS (ms)</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="totalMetric">--</div>
                <div class="metric-label">Total (ms)</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="requestsMetric">0</div>
                <div class="metric-label">Requests</div>
            </div>
        </div>
    </div>
    
    <script>
        let mediaRecorder = null;
        let audioChunks = [];
        let selectedLang = 'en';
        let isRecording = false;
        let stream = null;
        
        // DOM elements
        const micBtn = document.getElementById('micBtn');
        const statusText = document.getElementById('statusText');
        
        // Language selection
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.lang-btn').forEach(b => {
                    b.classList.remove('active');
                    b.setAttribute('aria-pressed', 'false');
                });
                btn.classList.add('active');
                btn.setAttribute('aria-pressed', 'true');
                selectedLang = btn.dataset.lang;
            });
        });
        
        // Request microphone permission on page load
        async function requestMicPermission() {
            try {
                statusText.textContent = '🎤 Requesting microphone access...';
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                statusText.textContent = '✅ Microphone ready! Click to start recording';
                statusText.style.color = 'var(--secondary)';
                
                // Stop the stream for now, we'll restart when recording
                stream.getTracks().forEach(t => t.stop());
                stream = null;
                
                return true;
            } catch (err) {
                console.error('Microphone permission error:', err);
                if (err.name === 'NotAllowedError') {
                    statusText.textContent = '❌ Microphone access denied. Please allow microphone in browser settings.';
                } else if (err.name === 'NotFoundError') {
                    statusText.textContent = '❌ No microphone found. Please connect a microphone.';
                } else {
                    statusText.textContent = '❌ Error: ' + err.message;
                }
                statusText.style.color = 'var(--danger)';
                return false;
            }
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            requestMicPermission();
        });
        
        // Click to toggle recording
        micBtn.addEventListener('click', toggleRecording);
        
        async function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        }
        
        async function startRecording() {
            if (isRecording) return;
            
            try {
                // Get fresh audio stream
                stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 16000
                    } 
                });
                
                // Check for supported MIME types
                let mimeType = 'audio/webm';
                if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                    mimeType = 'audio/webm;codecs=opus';
                } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                    mimeType = 'audio/mp4';
                } else if (MediaRecorder.isTypeSupported('audio/ogg')) {
                    mimeType = 'audio/ogg';
                }
                
                mediaRecorder = new MediaRecorder(stream, { mimeType });
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        audioChunks.push(e.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    if (audioChunks.length > 0) {
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        console.log('Recording complete, size:', audioBlob.size);
                        await processAudio(audioBlob);
                    }
                    // Stop all tracks
                    if (stream) {
                        stream.getTracks().forEach(t => t.stop());
                        stream = null;
                    }
                };
                
                mediaRecorder.onerror = (e) => {
                    console.error('MediaRecorder error:', e);
                    statusText.textContent = '❌ Recording error: ' + e.error;
                    statusText.style.color = 'var(--danger)';
                };
                
                // Request data every 250ms for more reliable recording
                mediaRecorder.start(250);
                isRecording = true;
                
                micBtn.classList.add('recording');
                micBtn.textContent = '⏹️';
                statusText.textContent = '🔴 Recording... Click to stop';
                statusText.className = 'status-text recording';
                
            } catch (err) {
                console.error('Recording error:', err);
                
                if (err.name === 'NotAllowedError') {
                    statusText.textContent = '❌ Microphone blocked. Click the 🔒 icon in the address bar to allow.';
                } else if (err.name === 'NotFoundError') {
                    statusText.textContent = '❌ No microphone detected.';
                } else {
                    statusText.textContent = '❌ Error: ' + err.message;
                }
                statusText.style.color = 'var(--danger)';
            }
        }
        
        function stopRecording() {
            if (!isRecording || !mediaRecorder) return;
            
            try {
                mediaRecorder.stop();
            } catch (e) {
                console.error('Stop error:', e);
            }
            
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.classList.add('processing');
            micBtn.textContent = '⏳';
            statusText.textContent = '⏳ Processing with Whisper...';
            statusText.className = 'status-text processing';
        }
        
        async function processAudio(audioBlob) {
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.webm');
            formData.append('language', selectedLang);
            
            try {
                const response = await fetch('/api/speech-to-speech', {
                    method: 'POST',
                    body: formData
                });
                handleResponse(await readJson(response));
            } catch (err) {
                showError(err.message || 'Error processing audio');
            }
        }
        
        async function sendText(text) {
            micBtn.classList.add('processing');
            statusText.textContent = '⏳ Processing...';
            statusText.className = 'status-text processing';
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, language: selectedLang })
                });
                
                handleResponse(await readJson(response));
            } catch (err) {
                showError(err.message || 'Error processing request');
            }
        }

        async function readJson(response) {
            let data = null;
            try { data = await response.json(); } catch (e) { /* non-JSON error body */ }
            if (!response.ok) {
                const detail = data && data.detail ? data.detail : `Server returned ${response.status}`;
                throw new Error(typeof detail === 'string' ? detail : 'Invalid request');
            }
            return data;
        }

        function showError(message) {
            micBtn.classList.remove('processing');
            micBtn.textContent = '🎤';
            statusText.textContent = '❌ ' + message;
            statusText.className = 'status-text';
            statusText.style.color = 'var(--danger)';
        }
        
        function handleResponse(data) {
            micBtn.classList.remove('processing');
            micBtn.textContent = '🎤';
            
            // Add chat bubbles
            addChatBubble('user', data.transcription);
            addChatBubble('assistant', data.response, data.safety_level, data.action);
            
            // Update metrics
            if (data.stt_ms) document.getElementById('sttMetric').textContent = Math.round(data.stt_ms);
            if (data.tts_ms) document.getElementById('ttsMetric').textContent = Math.round(data.tts_ms);
            document.getElementById('totalMetric').textContent = Math.round(data.total_ms || data.latency_ms);
            
            updateMetrics();
            
            // Play audio response
            if (data.audio) {
                playAudio(data.audio);
            } else if (data.tts_error) {
                showError(data.tts_error);
            } else {
                statusText.textContent = '✅ Click to record';
                statusText.className = 'status-text';
                statusText.style.color = '';
            }
        }
        
        function addChatBubble(type, text, safetyLevel = null, action = null) {
            const container = document.getElementById('chatContainer');
            const bubble = document.createElement('div');
            
            let bubbleClass = `chat-bubble ${type}`;
            if (action === 'TRANSFER_TO_HUMAN') bubbleClass += ' emergency';
            bubble.className = bubbleClass;
            
            const labelEl = document.createElement('div');
            labelEl.className = 'chat-label';
            labelEl.textContent = type === 'user' ? '👤 You' : '🤖 Apollo';
            if (safetyLevel && type === 'assistant') {
                const badge = document.createElement('span');
                badge.className = `safety-badge ${safetyLevel}`;
                badge.textContent = safetyLevel.toUpperCase();
                labelEl.appendChild(badge);
            }
            const textEl = document.createElement('div');
            textEl.textContent = text;  // never interpret user/model text as HTML
            bubble.append(labelEl, textEl);
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }
        
        function playAudio(base64Audio) {
            statusText.textContent = '🔊 Speaking...';
            statusText.className = 'status-text speaking';
            statusText.style.color = 'var(--secondary)';
            
            const audio = new Audio('data:audio/mp3;base64,' + base64Audio);
            audio.onended = () => {
                statusText.textContent = '✅ Click to record';
                statusText.className = 'status-text';
                statusText.style.color = '';
            };
            audio.onerror = (e) => {
                console.error('Audio playback error:', e);
                statusText.textContent = '❌ Audio playback error. Try again.';
                statusText.style.color = 'var(--danger)';
            };
            audio.play().catch(err => {
                console.error('Audio play failed:', err);
                statusText.textContent = '❌ Could not play audio';
                statusText.style.color = 'var(--danger)';
            });
        }
        
        async function updateMetrics() {
            try {
                const response = await fetch('/api/metrics');
                const data = await response.json();
                document.getElementById('requestsMetric').textContent = data.total_requests;
            } catch (err) {}
        }
        
        updateMetrics();
    </script>
</body>
</html>
