<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found · Apollo Voice Engine</title>
    <meta name="description" content="The page you asked for does not exist on this Apollo Voice Engine demo server.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f4f7fa">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/apollo.css">
    <script>try{var t=localStorage.getItem("apollo-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
    <script src="/assets/apollo-ui.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-header">
        <div class="app-header__inner">
            <a class="brand" href="/">
                <img class="brand__mark" src="/assets/favicon.svg" alt="" width="32" height="32">
                <span class="brand__text">
                    <span class="brand__name">Apollo Voice Engine</span>
                    <span class="brand__product">Demo server</span>
                </span>
            </a>
            <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Switch theme">
                <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </div>
    </header>

    <main id="main" class="page page--narrow">
        <section class="card" aria-labelledby="nfTitle" style="align-items:flex-start">
            <span class="badge badge--info">Error 404</span>
            <h1 id="nfTitle">Page not found</h1>
            <p class="muted">There is nothing at this address. The demo UI lives at the root of the server, and the JSON API is under <span class="mono">/api/</span>.</p>
            <div class="row">
                <a class="btn btn--primary" href="/">Go to the demo</a>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <div class="app-footer__inner">
            <span>Apollo Omni-Indic Voice Engine · research prototype</span>
        </div>
    </footer>
</body>
</html>
